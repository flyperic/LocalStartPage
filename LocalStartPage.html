<!doctype html>
<!--
  LOCALSTARTPAGE : page de démarrage locale, un seul fichier, sans dépendance ni connexion Internet.
  Auteur : flyperic — Licence MIT (voir le fichier LICENSE du dépôt)
  Version 0.1 — 13/11/2026   (à mettre à jour ici ET dans les constantes VERSION / VERSION_DATE du script)

  ORGANISATION DU FICHIER
    1. bloc style  : thèmes clair/sombre (variables CSS en haut), puis un bloc par zone de l'interface.
    2. corps (body) : conteneurs vides (#app, #toast, boîtes de dialogue) ; tout le contenu est construit par le script.
    3. bloc script : application complète, dans l'ordre :
         Constantes & identifiant → Utilitaires DOM (h, icônes) → Liens & mini-Markdown → Modèle de données
         → État & recherche → Sauvegarde navigateur/historique → Fichier lié (File System Access)
         → Sauvegarde rapide → Statut → Thème → Rendu (en-tête, onglets, cartes) → Réglages
         → Import/export des favoris → Raccourcis → Démarrage.

  DONNÉES
    - Rien n'est stocké dans ce fichier : tout est dans le navigateur (localStorage + IndexedDB), sous un préfixe
      « sp:<nom-du-fichier>/ ». Deux fichiers de noms différents ont donc des données séparées ; remplacer ce
      fichier par une nouvelle version ne fait rien perdre tant que son nom ne change pas.
    - Forme des données (voir normalize()) :
        { v:1, title, settings:{theme,newTab,backupDays,layout},
          pages:[ { id, name, cards:[ { id, type:'links'|'table'|'note', title, hue, w:1|2, collapsed,
                                         items:[{id,name,url}] | rows:[[texte,…],…] | text } ] } ] }
    - Clés localStorage : data (les données), snapshots (historique, 15 versions), tab (page ouverte),
      savedAt, backup, filesig, exportsig (signatures pour détecter les changements du fichier lié).
    - IndexedDB (base « sp:<nom> », magasin « kv ») : poignées des fichiers liés (handle, exportHandle).

  MODIFIER LE CODE (repères)
    - Nouveau réglage        : ajouter la valeur dans normalize(), puis un contrôle dans buildSettings().
    - Nouveau type de carte  : normalize(), renderCard(), addTile()/addCard(), filtered() (recherche).
    - Textes de l'interface  : écrits en français directement dans le code (pas de fichier de langue).
    - Toute modification de l'état passe par touch() (sauvegarde différée) ou touch(true) (immédiate),
      puis render() ; ne jamais écrire dans localStorage directement pour les données (voir persist()).
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LocalStartPage</title>
<style>
:root{
  /* Palette claire (défaut). La palette sombre est juste en dessous. --sat/--lig règlent la couleur des cartes. */
  --bg:#f4f5f9; --glow1:hsl(232 90% 93%); --glow2:hsl(320 90% 95%);
  --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  --text:#1c2130; --muted:#6a7288; --line:#e3e6ef; --chip:#eef0f7;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 10px 28px -14px rgba(20,30,60,.18);
  --accent:#4f5bd5; --sat:66%; --lig:52%; --linkl:40%;
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#0e1117; --glow1:hsl(232 50% 15%); --glow2:hsl(300 40% 12%);
  --card:rgba(24,29,40,.85); --card-solid:#181d28;
  --text:#e8ebf3; --muted:#8d96ab; --line:#272e3e; --chip:#212838;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.65);
  --accent:#7b86ff; --lig:64%; --linkl:72%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--text);
  background:var(--bg);
  background-image:radial-gradient(900px 420px at 10% -8%,var(--glow1),transparent 70%),radial-gradient(800px 400px at 100% 0%,var(--glow2),transparent 70%);
  background-attachment:fixed;
  font:15px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
.wrap{max-width:1320px;margin:0 auto;padding:30px 26px 90px}
button{font:inherit;color:inherit}

/* En-tête */
.top{display:flex;align-items:center;gap:10px;margin-bottom:28px;flex-wrap:wrap}
.ttl{min-width:0}
.top h1{margin:0;font-size:30px;line-height:1.15;font-weight:750;letter-spacing:-.025em}
.date{color:var(--muted);font-size:13.5px;margin-top:2px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--card-solid);color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer;transition:border-color .15s,transform .05s,background .15s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.icon{padding:0;width:36px;justify-content:center}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card-solid);cursor:pointer}
.chip i{width:7px;height:7px;border-radius:50%;background:#2fb67c;flex:none}
.chip.warn i{background:#e8a317}.chip.err i{background:#e5484d}
.chip.warn,.chip.err{color:var(--text)}
.ic{display:inline-grid;place-items:center;line-height:0}

/* Onglets */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:-8px 0 24px;align-items:center}
.tab{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 16px;border-radius:99px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:650;font-size:14px;cursor:pointer}
.tab:hover{background:var(--chip);color:var(--text)}
.tab.on{background:var(--card-solid);color:var(--text);border-color:var(--line);box-shadow:var(--shadow)}
.tab.edit{padding:0 4px;gap:2px;cursor:default}
.tab.edit .in{background:transparent;font-weight:650;padding:4px 6px;width:auto;font-size:14px}
.tab.add{border:1px dashed var(--line);padding:0 14px}
.ib:disabled{opacity:.3;cursor:default;pointer-events:none}

/* Grille maçonnerie */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));grid-auto-rows:8px;column-gap:18px;row-gap:0}
/* Disposition « ordonnée » : les cartes se placent dans l'ordre de la liste, sans jamais remonter combler un trou.
   Disposition « compacte » (.dense) : le navigateur comble les trous avec les cartes suivantes (l'ordre visuel peut alors différer). */
/* Disposition « lignes » (.rows, le défaut) : grille régulière, chaque ligne a la hauteur de sa carte la plus haute et les cartes
   de la ligne s'étirent à cette hauteur (sauf les cartes repliées). Pas de maçonnerie : layout() n'intervient pas. */
.grid.dense{grid-auto-flow:dense}
.grid.rows{grid-auto-rows:auto;row-gap:18px}
.grid.rows>.cell{display:flex}
.grid.rows>.cell>*{flex:1;min-width:0}
.grid.rows>.cell>.card.collapsed{flex:0 0 auto;align-self:flex-start;width:100%}
.grid.rows .empty{grid-row:auto}
.cell{min-width:0}
.cell.w2{grid-column:span 2}
@media (max-width:700px){.cell.w2{grid-column:span 1}.wrap{padding:22px 16px 80px}}
.empty{grid-column:1/-1;grid-row:span 10;color:var(--muted);padding:40px 0;text-align:center}

.card{--c:hsl(var(--h) var(--sat) var(--lig));--lc:hsl(var(--h) 62% var(--linkl));
  background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.card::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 30%,transparent))}
.card-h{display:flex;align-items:center;gap:9px;padding:15px 18px 6px}
.card-h .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.card-h h2{margin:0;font-size:12px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);min-width:0;overflow-wrap:anywhere;line-height:1.3}
.card-h.edit{padding:10px 10px 6px;gap:6px}

/* Liens */
.links{padding:4px 9px 12px;display:flex;flex-direction:column}
.links a,.links .nolink{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:11px;color:var(--text);text-decoration:none;font-weight:550;font-size:14.5px;min-width:0}
.links a:hover{background:color-mix(in srgb,var(--c) 11%,transparent)}
.links .nolink{color:var(--muted)}
.links .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:750;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.links a:hover .badge{background:var(--c);color:#fff}

/* Tableaux */
.tscroll{overflow-x:auto;padding:2px 0 8px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:750;padding:8px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 18px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even){background:color-mix(in srgb,var(--c) 5%,transparent)}
.tbl a,.note a{color:var(--lc);text-decoration:none;font-weight:600}
.tbl a:hover,.note a:hover{text-decoration:underline}
.tbl.edit td,.tbl.edit th{padding:4px 4px;border:0;background:none}
.tbl.edit tbody tr:nth-child(even){background:none}
.tbl.edit .in{min-width:90px}
.tbl.edit .hdr .in{font-weight:700}
.tbl.edit .ib{margin:auto}
.colbar{display:flex;justify-content:center;gap:1px}
.colbar .ib{width:22px;height:22px}
.tedit{padding:2px 10px 8px;overflow-x:auto}
.tactions{display:flex;gap:8px;padding:2px 14px 14px}

/* Lignes de tableau : repère de dépôt */
.tbl tr.drop-before,.tbl tr.drop-after{box-shadow:none}
.tbl tr.drop-before td{box-shadow:inset 0 3px 0 0 var(--accent)}
.tbl tr.drop-after td{box-shadow:inset 0 -3px 0 0 var(--accent)}
.tbl.edit td:first-child,.tbl.edit th:first-child{width:30px}

/* Notes */
.note{padding:6px 18px 18px;font-size:14px;overflow-wrap:anywhere}

/* Édition */
.in{font:inherit;color:inherit;background:var(--chip);border:1px solid transparent;border-radius:9px;padding:6px 9px;width:100%;min-width:0}
.in::placeholder{color:var(--muted);opacity:.7}
.in:focus{outline:none;border-color:var(--c,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--accent)) 22%,transparent);background:var(--card-solid)}
.in.title-in{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px}
.h1in{font-size:26px;font-weight:750;letter-spacing:-.02em;padding:4px 10px;width:min(520px,80vw)}
textarea.in{resize:none;line-height:1.45;min-height:90px;display:block}
.ib{width:26px;height:26px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.ib:hover{background:var(--chip);color:var(--text)}
.ib.del:hover{color:#d23b43}
.grip{cursor:grab}
.hue{width:20px;height:20px;border-radius:50%;border:0;background:var(--c);cursor:pointer;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent);flex:none;padding:0}
.ledit{padding:6px 12px 4px;display:flex;flex-direction:column;gap:8px;min-height:16px}
.lrow{display:grid;grid-template-columns:18px minmax(0,1fr) 24px;gap:6px;align-items:center;border-radius:10px}
.lrow .two{display:flex;flex-direction:column;gap:4px}
.lrow .url{font-size:12.5px;color:var(--muted)}
.addrow{margin:4px 12px 14px}
.addtile{border:2px dashed var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted);font-size:13px}
.addtile .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cell.dragging{opacity:.45}
.drop-before{box-shadow:0 -3px 0 0 var(--accent)}
.drop-after{box-shadow:0 3px 0 0 var(--accent)}
.cell.drop-before,.cell.drop-after{box-shadow:none}
.cell.drop-before .card{box-shadow:0 -4px 0 0 var(--accent)}
.cell.drop-after .card{box-shadow:0 4px 0 0 var(--accent)}

/* Recherche */
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.search input{height:36px;width:210px;border-radius:11px;border:1px solid var(--line);background:var(--card-solid);padding:0 12px 0 34px;font:inherit;font-size:13.5px;color:var(--text);transition:width .15s,border-color .15s}
.search input:focus{outline:none;width:280px;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.search input::placeholder{color:var(--muted)}
.cnt{font-size:11px;font-weight:750;background:var(--accent);color:#fff;border-radius:99px;padding:1px 7px}
.pgh{display:flex;align-items:center;gap:8px;margin:22px 0 10px;padding:0;border:0;background:none;font:inherit;font-size:13px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.pgh:first-child{margin-top:0}
.pgh:hover{color:var(--text)}
.tab.drop-tab{outline:2px solid var(--accent)}

/* Repli des cartes */
.card-h.tog{cursor:pointer;user-select:none}
.card-h.tog:hover h2{color:var(--text)}
.card-h .chev{margin-left:auto;color:var(--muted);display:inline-grid;transition:transform .15s}
.card.collapsed .chev{transform:rotate(-90deg)}
.card.collapsed .card-h{padding-bottom:14px}
.card-h .nb{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--chip);border-radius:99px;padding:1px 8px}
.card-h .nb+.chev{margin-left:8px}

/* Menu */
.menu{position:fixed;z-index:60;background:var(--card-solid);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:6px;min-width:180px;max-height:60vh;overflow:auto}
.menu .mh{font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px}
.menu button:hover{background:var(--chip)}

/* Mini-Markdown (notes) */
.note>:first-child{margin-top:0}
.note .md-h{font-weight:750;margin:12px 0 4px;line-height:1.3}
.note .md-h1{font-size:17px}.note .md-h2{font-size:15px}
.note .md-h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.note .md-sp{height:8px}
.note ul,.note ol{margin:4px 0;padding-left:20px}.note li{margin:2px 0}
.note code,.tbl code{background:var(--chip);padding:1px 6px;border-radius:6px;font-size:.9em;font-family:ui-monospace,Consolas,monospace}
.note .md-q{border-left:3px solid var(--c);padding-left:10px;color:var(--muted);margin:4px 0}
.note hr{border:0;border-top:1px solid var(--line);margin:10px 0}

/* Bouton sauvegarde */
.btn.due{border-color:#e8a317;box-shadow:0 0 0 3px rgba(232,163,23,.2)}
.btn.due .ic{color:#e8a317}
@media (max-width:980px){#bk .lbl{display:none}#bk{padding:0;width:36px;justify-content:center}}
.ds select{font:inherit;font-size:13.5px;color:var(--text);background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:5px 8px}

/* Conflit */
#cdlg{width:min(640px,94vw)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 22px 10px}
@media (max-width:560px){.cols{grid-template-columns:1fr}}
.cside{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--chip)}
.cside h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cbig{font-weight:700;font-size:15px}
.cwhen{font-size:12.5px;color:var(--muted);margin-top:2px}
.cact{display:flex;flex-direction:column;gap:8px;padding:6px 22px 8px}
.cact .btn{height:auto;min-height:38px;padding:8px 14px;justify-content:center;text-align:center;white-space:normal}
.cnote{padding:2px 22px 18px;color:var(--muted);font-size:12.5px}

/* Import de favoris */
#idlg{width:min(880px,96vw);max-height:92vh}
#idlg[open]{display:flex;flex-direction:column}
.ibody{overflow:auto;padding:0 22px;flex:1;min-height:0}
.ibody .chk{margin-bottom:6px;font-size:13.5px;align-items:flex-start}
.bm-g{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card-solid)}
.bm-gh{display:flex;gap:8px;align-items:center;padding:8px 12px}
.bm-gh .nm{flex:1;min-width:0;font-weight:650}
.bm-flag{font-size:11.5px;color:var(--muted);white-space:nowrap}
.bm-n{font-size:12px;color:var(--muted);white-space:nowrap;font-weight:600}
.bm-n.part{color:#b7791f}
.bm-chev{transition:transform .15s}.bm-chev.open{transform:rotate(180deg)}
.bm-cards{padding:0 12px 10px 40px;display:flex;flex-direction:column;gap:6px}
.bm-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center}
.bm-card.off{opacity:.45}
.bm-card .in{font-size:13px;padding:4px 8px}
.bm-links{grid-column:2/-1;margin:0 0 4px;padding:0 0 0 2px;list-style:none;font-size:12.5px;color:var(--muted)}
.bm-links li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0}
.bm-links li.skip{text-decoration:line-through;opacity:.6}
.ifoot{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:14px 22px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.ifoot .sum{flex:1;color:var(--muted);font-size:13px;min-width:180px}
.btn:disabled{opacity:.45;cursor:default}

/* Toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.2s;z-index:50;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}

/* Réglages */
dialog{border:1px solid var(--line);border-radius:20px;background:var(--card-solid);color:var(--text);padding:0;width:min(580px,94vw);max-height:88vh;box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,25,.5);backdrop-filter:blur(3px)}
.dh{display:flex;align-items:center;padding:18px 22px 6px}
.dh h3{margin:0;font-size:18px;flex:1}
.ds{padding:12px 22px 8px}
.ds h4{margin:6px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ds p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.ds .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.segs{display:inline-flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px;margin-bottom:10px}
.seg{border:0;background:none;padding:6px 14px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg.on{background:var(--card-solid);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:10px;cursor:pointer}
.snaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.snaps li{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:7px 10px;border-radius:10px;background:var(--chip)}
.snaps li span{flex:1}
.dfoot{padding:6px 22px 20px;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<dialog id="cdlg"></dialog>
<dialog id="idlg"></dialog>
<input type="file" id="importer" accept=".json,application/json" hidden>
<input type="file" id="bmimport" accept=".html,.htm,text/html" hidden>
<noscript>Cette page nécessite JavaScript.</noscript>

<script>
(function(){
'use strict';

/* ---------- Constantes & utilitaires ---------- */
/* Teintes proposées pour les cartes (0-360, dans l'ordre du cercle chromatique). Un clic sur le rond coloré
   passe à la suivante ; une nouvelle carte reçoit la moins utilisée de la page (voir nextHue). */
const HUES=[355,25,42,75,110,150,185,205,230,265,295,320];
const VERSION='0.1', VERSION_DATE='13/11/2026';  // affichés en bas des réglages (garder synchrone avec l'en-tête du fichier)
const ROW=8, GAP=18;                          // mise en page en maçonnerie : hauteur d'une ligne de grille / espace entre cartes (px)

/* Création d'élément : h('div',{class:'x',onclick:fn},enfant1,'texte',…). Les enfants null/false sont ignorés ;
   les textes sont toujours insérés comme texte (jamais interprétés comme du HTML). */
function h(tag,props,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='style') el.style.cssText=v;
    else if(k==='dataset') Object.assign(el.dataset,v);
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k in el){ try{ el[k]=v; }catch(_){ el.setAttribute(k,v); } }
    else el.setAttribute(k,v);
  }
  for(const kid of kids.flat()){
    if(kid==null||kid===false) continue;
    el.append(kid.nodeType?kid:document.createTextNode(kid));
  }
  return el;
}

/* ---------- URL & texte enrichi ---------- */
/* Normalise une adresse saisie : ajoute https://, convertit les chemins Windows (C:\… ou \\serveur\…) en file://,
   et renvoie '' pour les schémas non autorisés (ex. javascript:) — c'est une protection, à conserver. */
function fixUrl(u){
  u=str(u).trim(); if(!u) return '';
  if(/^\\\\/.test(u)) return 'file://'+u.slice(2).replace(/\\/g,'/');
  if(/^[a-zA-Z]:[\\/]/.test(u)) return 'file:///'+u.replace(/\\/g,'/');
  if(/^[^\s/:]+:\d+/.test(u)) return 'http://'+u;
  const m=u.match(/^([a-z][a-z0-9+.-]*):/i);
  if(m) return /^(https?|file|mailto|tel|ftp)$/i.test(m[1])?u:'';
  return 'https://'+u;
}
function hostOf(u){ try{ return new URL(fixUrl(u)).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function anchor(href,label){
  return h('a',{href,target:state.settings.newTab?'_blank':null,rel:'noopener noreferrer'},label);
}
/* Mise en forme d'une ligne : **gras**, *italique*, `code`, [texte](adresse), adresses nues. Construit des nœuds DOM. */
function inline(text,parent){
  const re=/\*\*(.+?)\*\*|\*([^\s*](?:[^*]*[^\s*])?)\*|`([^`]+)`|\[([^\]]+)\]\(([^)\s]+)\)|((?:https?:\/\/|file:\/\/)[^\s<>"]+)/g;
  let m,last=0;
  while((m=re.exec(text))){
    if(m.index>last) parent.append(text.slice(last,m.index));
    if(m[1]!=null){ const e=h('strong'); inline(m[1],e); parent.append(e); }
    else if(m[2]!=null){ const e=h('em'); inline(m[2],e); parent.append(e); }
    else if(m[3]!=null) parent.append(h('code',{},m[3]));
    else{ const url=m[5]||m[6], href=fixUrl(url); parent.append(href?anchor(href,m[4]||url):m[0]); }
    last=re.lastIndex;
  }
  if(last<text.length) parent.append(text.slice(last));
}
/* Cellule de tableau : texte multi-lignes avec mise en forme en ligne. */
function rich(text,parent){
  str(text).split('\n').forEach((line,i)=>{ if(i) parent.append(document.createElement('br')); inline(line,parent); });
}
/* Note : un mini-Markdown par ligne (titres #, listes -, 1., citations >, séparateur ---). */
function md(text,parent){
  let list=null, type=null;
  for(const raw of str(text).split('\n')){
    let m;
    if((m=raw.match(/^\s*[-*•]\s+(.*)$/))){
      if(type!=='ul'){ list=h('ul'); parent.append(list); type='ul'; }
      const li=h('li'); inline(m[1],li); list.append(li); continue;
    }
    if((m=raw.match(/^\s*\d+[.)]\s+(.*)$/))){
      if(type!=='ol'){ list=h('ol'); parent.append(list); type='ol'; }
      const li=h('li'); inline(m[1],li); list.append(li); continue;
    }
    list=null; type=null;
    if((m=raw.match(/^(#{1,3})\s+(.*)$/))){ const e=h('div',{class:'md-h md-h'+m[1].length}); inline(m[2],e); parent.append(e); }
    else if(/^\s*([-*_])\1{2,}\s*$/.test(raw)) parent.append(h('hr'));
    else if((m=raw.match(/^>\s?(.*)$/))){ const e=h('div',{class:'md-q'}); inline(m[1],e); parent.append(e); }
    else if(!raw.trim()) parent.append(h('div',{class:'md-sp'}));
    else{ const e=h('div',{class:'md-p'}); inline(raw,e); parent.append(e); }
  }
}

/* ---------- Modèle de données ---------- */
/* Valide/répare des données quelconques (stockage, fichier importé…) et renvoie toujours un état complet.
   Accepte aussi l'ancien format sans pages (liste de cartes à la racine). Renvoie null si ce n'est pas un objet. */
function normalize(d){
  if(!d||typeof d!=='object') return null;
  const out={v:1,title:str(d.title)||PID,settings:{theme:'auto',newTab:true},pages:[]};
  const s=d.settings||{};
  out.settings.theme=['auto','light','dark'].includes(s.theme)?s.theme:'auto';
  out.settings.newTab=s.newTab!==false;
  out.settings.layout=['rows','ordered','dense'].includes(s.layout)?s.layout:'rows';  // disposition des cartes (voir .grid.dense)
  out.settings.backupDays=[0,3,7,14,30].includes(Number(s.backupDays))?Number(s.backupDays):7;
  const normCards=(list)=>{ const res=[];
  for(const c of (Array.isArray(list)?list:[])){
    if(!c||typeof c!=='object') continue;
    const type=['links','table','note'].includes(c.type)?c.type:'links';
    const card={id:str(c.id)||uid(),type,title:str(c.title),hue:Number.isFinite(c.hue)?c.hue:HUES[0],w:c.w===2?2:1,collapsed:c.collapsed===true};
    if(type==='links') card.items=(Array.isArray(c.items)?c.items:[]).map(i=>({id:str(i&&i.id)||uid(),name:str(i&&i.name),url:str(i&&i.url)}));
    if(type==='table'){
      let rows=(Array.isArray(c.rows)?c.rows:[]).map(r=>Array.isArray(r)?r.map(str):[]);
      if(!rows.length) rows=[['']];
      const n=Math.max(1,...rows.map(r=>r.length));
      card.rows=rows.map(r=>{ const x=r.slice(); while(x.length<n) x.push(''); return x; });
    }
    if(type==='note') card.text=str(c.text);
    res.push(card);
  }
  return res; };
  if(Array.isArray(d.pages)&&d.pages.length) out.pages=d.pages.filter(p=>p&&typeof p==='object').map(p=>({id:str(p.id)||uid(),name:str(p.name)||'Page',cards:normCards(p.cards)}));
  if(!out.pages.length) out.pages=[{id:uid(),name:'Accueil',cards:normCards(d.cards)}];
  return out;
}

/* ---------- État ----------
   state     : les données (voir l'en-tête du fichier)
   committed : dernière version enregistrée, en texte JSON (sert à détecter les changements et à annuler)
   undoStack : versions précédentes pour « Annuler » */
let rawLS=null; try{ rawLS=localStorage.getItem(LS_KEY); }catch(e){}
let state=null;
if(rawLS){
  try{ state=normalize(JSON.parse(rawLS)); }
  catch(e){ try{ localStorage.setItem(K('corrupt'),rawLS); }catch(_){} }
}
const freshStart=!state;
if(!state) state=defaultState();

let committed=JSON.stringify(state);
const undoStack=[];
let editing=false, saving=false, saveTimer=null, lsOk=true;
let drag=null, pendingFocus=null, toastT=null, raf=0;
const TAB_KEY=K('tab');
let activeId=null; try{ activeId=localStorage.getItem(TAB_KEY); }catch(e){}
const curPage=()=>{ let p=state.pages.find(x=>x.id===activeId); if(!p){ p=state.pages[0]; activeId=p.id; } return p; };
const cards=()=>curPage().cards;
let query='', q='';
/* Texte comparable : minuscules et sans accents (la recherche ignore donc casse et accents). */
const norm=v=>str(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const hit=v=>norm(v).includes(q);
/* Recherche : renvoie la carte réduite à ce qui correspond (ou null s'il n'y a rien). Une correspondance sur le titre garde toute la carte. */
function filtered(card){
  if(!q) return card;
  const th=hit(card.title);
  if(card.type==='links'){ const items=th?card.items:card.items.filter(i=>hit(i.name)||hit(i.url)); return items.length?{...card,items}:null; }
  if(card.type==='table'){
    if(th) return card;
    const body=card.rows.slice(1).filter(r=>r.some(hit));
    return (body.length||card.rows[0].some(hit))?{...card,rows:[card.rows[0],...body]}:null;
  }
  return (th||hit(card.text))?card:null;
}
function saveTab(){ try{ localStorage.setItem(TAB_KEY,activeId); }catch(e){} }
function setTab(id){ flush(); activeId=id; saveTab(); renderBody(); }
function addPage(){
  const p={id:uid(),name:'Nouvelle page',cards:[]};
  state.pages.push(p); activeId=p.id; saveTab(); pendingFocus='page:'+p.id; touch(true); render();
}
function movePage(i,d){
  const j=i+d; if(j<0||j>=state.pages.length) return;
  const [p]=state.pages.splice(i,1); state.pages.splice(j,0,p); touch(true); render();
}
function deletePage(id){
  const i=state.pages.findIndex(p=>p.id===id); if(i<0||state.pages.length<2) return;
  state.pages.splice(i,1);
  activeId=state.pages[Math.min(i,state.pages.length-1)].id; saveTab();
  touch(true); render(); toast('Page supprimée',{label:'Annuler',fn:undo});
}

/* ---------- Sauvegarde : navigateur + historique ---------- */
function readSnaps(){ try{ return JSON.parse(localStorage.getItem(LS_SNAP)||'[]'); }catch(e){ return []; } }
/* Historique : ajoute une version (max 15). Sans force, au plus une toutes les 5 min. label = texte affiché dans les réglages. */
function addSnap(j,force,label){
  const s=readSnaps(), last=s[0];
  const store=()=>{ const list=s.slice(0,15); while(list.length){ try{ localStorage.setItem(LS_SNAP,JSON.stringify(list)); return; }catch(e){ list.pop(); } } };
  if(last&&last.j===j){ if(label&&last.label!==label){ last.label=label; store(); } return; }
  if(!force&&last&&Date.now()-last.t<5*60e3) return;
  const e={t:Date.now(),j}; if(label) e.label=label;
  s.unshift(e); store();
}
/* Écrit dans le navigateur (données + historique), puis recopie dans le fichier lié sauf si opts.file===false. */
function persist(j,opts){
  if(wiping) return;
  try{ localStorage.setItem(LS_KEY,j); lsOk=true; }
  catch(e){
    try{ localStorage.setItem(LS_SNAP,JSON.stringify(readSnaps().slice(0,2))); localStorage.setItem(LS_KEY,j); lsOk=true; }
    catch(e2){ lsOk=false; toast('Impossible d’enregistrer dans le navigateur — exportez vos données.'); }
  }
  addSnap(j,false);
  try{ localStorage.setItem(LS_SAVEDAT,String(Date.now())); }catch(e){}
  if(!opts||opts.file!==false) queueFileWrite();
}
/* À appeler après toute modification de state : enregistre dans 0,5 s (ou tout de suite si now). */
function touch(now){
  saving=true; setStatus();
  clearTimeout(saveTimer);
  if(now) flush(); else saveTimer=setTimeout(flush,500);
}
/* Enregistre maintenant si quelque chose a changé, et mémorise la version précédente pour « Annuler ». */
function flush(){
  clearTimeout(saveTimer); saveTimer=null;
  const j=JSON.stringify(state);
  if(j!==committed){
    undoStack.push(committed); if(undoStack.length>60) undoStack.shift();
    committed=j; persist(j);
  }
  saving=false; setStatus();
}
function undo(){
  flush();
  const prev=undoStack.pop();
  if(!prev){ toast('Rien à annuler'); return; }
  state=JSON.parse(prev); committed=prev; persist(prev); render();
}
/* Remplace tout l'état (import, restauration…) en gardant l'ancien dans l'historique et dans « Annuler ». */
function replaceState(next,label){
  addSnap(JSON.stringify(state),true,label||'Avant remplacement de la page');
  flush();
  undoStack.push(committed);
  state=next; committed=JSON.stringify(state);
  persist(committed); render();
}

/* ---------- Sauvegarde : fichier lié (Edge / Chrome) ---------- */
let fileHandle=null, exportHandle=null, fileState='none', awaitingLoad=false, fileQueue=Promise.resolve();
const JSON_TYPES=[{description:'Données LocalStartPage (JSON)',accept:{'application/json':['.json']}}];

/* IndexedDB : sert uniquement à mémoriser les poignées de fichiers (impossibles à mettre dans localStorage). */
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(NS+PID,1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>{ db.close(); res(q.result); }; q.onerror=()=>{ db.close(); rej(q.error); }; }); }
async function idbSet(k,v){ if(wiping) return; const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>{ db.close(); res(); }; t.onerror=()=>{ db.close(); rej(t.error); }; }); }

/* Pages du même type présentes dans ce navigateur (une par nom de fichier) */
async function listPages(){
  const m=new Map(); const add=id=>{ if(!m.has(id)) m.set(id,{id,bytes:0}); return m.get(id); };
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(NS)&&k.includes('/')){ const e=add(k.slice(NS.length,k.lastIndexOf('/'))); e.bytes+=(k.length+(localStorage.getItem(k)||'').length)*2; } } }catch(e){}
  try{ if(indexedDB.databases) (await indexedDB.databases()).forEach(d=>{ if(d.name&&d.name.startsWith(NS)) add(d.name.slice(NS.length)); }); }catch(e){}
  m.set(PID,m.get(PID)||{id:PID,bytes:0});
  return [...m.values()].sort((a,b)=>(b.id===PID)-(a.id===PID)||a.id.localeCompare(b.id));
}
async function wipePage(id){
  const cur=id===PID; if(cur){ wiping=true; clearTimeout(saveTimer); saveTimer=null; }
  try{ const ks=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(NS+id+'/')) ks.push(k); } ks.forEach(k=>localStorage.removeItem(k)); }catch(e){}
  try{ await new Promise(res=>{ const r=indexedDB.deleteDatabase(NS+id); r.onsuccess=r.onerror=r.onblocked=()=>res(); setTimeout(res,1500); }); }catch(e){}
  if(cur) location.reload();
}
const kb=n=>n<1024?n+' o':(n/1024).toFixed(n<10240?1:0)+' Ko';

/* Signatures : empreinte (hash + longueur) d'un contenu normalisé. On compare celle du fichier lié à celle
   de la dernière synchronisation pour savoir si le fichier a été modifié ailleurs. */
const LS_SIG=K('filesig'), LS_ESIG=K('exportsig'), LS_SAVEDAT=K('savedAt');
function sig(t){ return hashStr(t)+':'+t.length; }
function sigState(json){ return sig(JSON.stringify(normalize(JSON.parse(json)))); }
function getSig(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function setSig(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
async function readFile(hd){
  const f=await hd.getFile(); const txt=await f.text();
  if(!txt.trim()) return {empty:true};
  let data=null; try{ data=normalize(JSON.parse(txt)); }catch(e){}
  return {empty:false,data,sig:data?sig(JSON.stringify(data)):null,mtime:f.lastModified};
}
const pagesTxt=st=>st.pages.length+' page'+(st.pages.length>1?'s':'')+' · '+totalCards(st)+' carte'+(totalCards(st)>1?'s':'');
const whenTxt=t=>t?new Date(t).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'}):'date inconnue';

let conflictP=null;
/* Boîte de dialogue de conflit (fichier et page diffèrent). Renvoie 'local' | 'file' | null (décider plus tard). */
function askConflict(r){
  if(conflictP) return conflictP;
  conflictP=new Promise(res=>{
    const d=$('#cdlg'); let choice=null;
    const done=c=>{ choice=c; d.close(); };
    const foreign=!r.data;
    const side=(label,big,when)=>h('div',{class:'cside'},h('h4',{},label),h('div',{class:'cbig'},big),h('div',{class:'cwhen'},when));
    d.replaceChildren(
      h('div',{class:'dh'},h('h3',{},foreign?'Le fichier lié n’est pas une sauvegarde de LocalStartPage':'Le fichier lié et cette page sont différents')),
      h('div',{class:'ds'},h('p',{},foreign
        ?'Le fichier contient autre chose que des données de LocalStartPage. Rien n’a été modifié.'
        :'Le fichier a changé depuis la dernière synchronisation (autre navigateur ou autre ordinateur, par exemple). Rien n’a été écrasé : choisissez la version à garder.')),
      foreign?null:h('div',{class:'cols'},
        side('Cette page (navigateur)',pagesTxt(state),'Modifiée : '+whenTxt(Number(getSig(LS_SAVEDAT))||0)),
        side('Fichier lié',pagesTxt(r.data),'Modifié : '+whenTxt(r.mtime))),
      h('div',{class:'cact'},
        h('button',{class:'btn primary',onclick:()=>done('local')},foreign?'Écraser le fichier avec cette page':'Garder cette page et mettre le fichier à jour'),
        foreign?null:h('button',{class:'btn',onclick:()=>done('file')},'Utiliser le fichier et remplacer cette page'),
        h('button',{class:'btn',id:'cLater',onclick:()=>done(null)},'Décider plus tard (rien n’est écrit)')),
      h('div',{class:'cnote'},foreign?'':'L’autre version est conservée dans l’historique (Réglages) : vous pourrez la restaurer.'));
    d.addEventListener('close',()=>{ conflictP=null; res(choice); },{once:true});
    d.showModal();
    const later=$('#cLater'); if(later) later.focus();
  });
  return conflictP;
}
/* Remplace la page par le contenu du fichier lié ; l'ancienne version va dans l'historique. */
function adoptFile(d){
  addSnap(JSON.stringify(state),true,'Page avant chargement du fichier lié');
  clearTimeout(saveTimer); saveTimer=null; saving=false;
  undoStack.push(committed);
  state=d; committed=JSON.stringify(state);
  persist(committed,{file:false}); addSnap(committed,true,'Version du fichier lié chargée');
  setSig(LS_SIG,sigState(committed));
  render();
}
/* Décide quoi faire avant d'écrire dans le fichier lié : 'write' | 'noop' | 'loaded' | 'hold' */
async function reconcile(hd,localJson){
  const r=await readFile(hd);
  if(r.empty) return 'write';
  if(!r.data){
    return (await askConflict(r))==='local'?'write':'hold';
  }
  const mine=sigState(localJson), last=getSig(LS_SIG);
  if(r.sig===mine){ setSig(LS_SIG,mine); return 'noop'; }
  if(last&&r.sig===last) return 'write';
  if(last&&mine===last){
    adoptFile(r.data);
    toast('Le fichier lié était plus récent : il a été chargé',{label:'Annuler',fn:undo});
    return 'loaded';
  }
  const c=await askConflict(r);
  if(c==='file'){ adoptFile(r.data); toast('Fichier chargé. L’ancienne version de la page est dans l’historique.'); return 'loaded'; }
  if(c==='local'){ addSnap(JSON.stringify(r.data),true,'Ancienne version du fichier lié'); toast('Fichier mis à jour. Son ancienne version est dans l’historique.'); return 'write'; }
  return 'hold';
}

/* Recopie la version enregistrée dans le fichier lié. Les écritures sont mises en file (une à la fois) ;
   renvoie 'write' | 'noop' | 'loaded' | 'hold' | 'skip' | 'error'. */
function queueFileWrite(){
  if(!fileHandle||fileState!=='ok'||awaitingLoad) return Promise.resolve('skip');
  const t=fileQueue.then(async()=>{
    if(!fileHandle||fileState!=='ok'||awaitingLoad) return 'skip';
    const j=committed; let act='error';
    try{
      act=await reconcile(fileHandle,j);
      if(act==='write'){ const w=await fileHandle.createWritable(); await w.write(j); await w.close(); setSig(LS_SIG,sigState(j)); markBackup(j); }
      else if(act==='noop') markBackup(j);
      else if(act==='hold') fileState='conflict';
    }catch(e){ console.warn('Écriture fichier impossible',e); fileState='error'; act='error'; }
    setStatus(); refreshSettings(); return act;
  });
  fileQueue=t.catch(()=>{});
  return t;
}
function resolveConflictNow(){
  if(!fileHandle) return;
  fileState='ok'; setStatus();
  queueFileWrite();
}
/* Au démarrage : retrouve le fichier lié mémorisé et vérifie qu'on a encore le droit d'y écrire. */
async function initFile(){
  if(!window.showSaveFilePicker||!window.indexedDB){ fileState='unsupported'; setStatus(); return; }
  try{
    try{ exportHandle=(await idbGet('exportHandle'))||null; }catch(e){}
    const hd=await idbGet('handle');
    if(hd){
      fileHandle=hd;
      awaitingLoad=freshStart;
      const p=await hd.queryPermission({mode:'readwrite'});
      fileState=p==='granted'?'ok':'needs-permission';
      if(fileState==='ok'){
        if(awaitingLoad){ const ok=await loadFromHandle(); awaitingLoad=false; if(!ok) await queueFileWrite(); }
        else await queueFileWrite();
      }
    }
  }catch(e){ console.warn(e); }
  setStatus();
}
async function loadFromHandle(){
  const r=await readFile(fileHandle);

  setSig(LS_SIG,sigState(committed)); render();
  return true;
}
/* Un clic de l'utilisateur est nécessaire pour redonner l'accès au fichier à chaque nouvelle session du navigateur. */
async function reconnect(){

      const ok=await loadFromHandle(); awaitingLoad=false;
      toast(ok?'Données restaurées depuis le fichier':'Fichier relié');
      if(!ok) await queueFileWrite();
    }else{
      const act=await queueFileWrite();
      if(act==='write'||act==='noop') toast('Fichier à jour');

  }catch(e){ console.warn(e); toast('Impossible de rouvrir le fichier — liez-le à nouveau.'); }

}

/* ---------- Sauvegarde rapide (bouton « Sauvegarder ») ---------- */
const LS_BK=K('backup');
/* Empreinte rapide (djb2) : détecte un changement, ce n'est pas une protection cryptographique. */
function hashStr(t){ let x=5381; for(let i=0;i<t.length;i++) x=((x<<5)+x+t.charCodeAt(i))|0; return x; }
function readBk(){ try{ return JSON.parse(localStorage.getItem(LS_BK)||'null')||{t:0,h:null}; }catch(e){ return {t:0,h:null}; } }
function markBackup(compact){ try{ localStorage.setItem(LS_BK,JSON.stringify({t:Date.now(),h:hashStr(compact)})); }catch(e){} setStatus(); }
function ago(t){
  const sec=Math.max(0,(Date.now()-t)/1000);
  if(sec<60) return 'à l’instant';
  if(sec<3600) return 'il y a '+Math.floor(sec/60)+' min';
  if(sec<86400) return 'il y a '+Math.floor(sec/3600)+' h';
  const d=Math.floor(sec/86400); return 'il y a '+d+' jour'+(d>1?'s':'');
}
/* Faut-il rappeler de sauvegarder ? Non si un fichier est lié, si rien n'a changé depuis la dernière sauvegarde, ou si le rappel est désactivé. */
function backupDue(){
  const days=state.settings.backupDays; if(!days) return false;
  if(fileState==='ok') return false;
  try{ if(!localStorage.getItem(LS_KEY)) return false; }catch(e){ return false; }
  const bk=readBk(); if(bk.h===hashStr(committed)) return false;
  return !bk.t||(Date.now()-bk.t)>days*864e5;
}
const totalCards=st=>st.pages.reduce((n,pg)=>n+pg.cards.length,0);
async function ensureRW(hd){
  let perm=await hd.queryPermission({mode:'readwrite'});
  if(perm!=='granted') perm=await hd.requestPermission({mode:'readwrite'});
  return perm==='granted';
}
/* Écrit dans le fichier de sauvegarde « rapide », mais demande confirmation avant d'écraser un contenu inconnu ou plus récent. */
async function writeGuarded(hd,json){
  let r=null; try{ r=await readFile(hd); }catch(e){}
  if(r&&!r.empty){
    if(!r.data){
      if(!confirm('Le fichier choisi contient autre chose qu’une sauvegarde de LocalStartPage.\nL’écraser quand même ?')) return false;
    }else if(r.sig!==sigState(JSON.stringify(state))&&r.sig!==getSig(LS_ESIG)){
      if(!confirm('Ce fichier a changé depuis votre dernière sauvegarde dessus : il contient '+pagesTxt(r.data)+' (modifié le '+whenTxt(r.mtime)+'), la page actuelle '+pagesTxt(state)+'.\nL’écraser ? Son ancienne version sera conservée dans l’historique.')) return false;
      addSnap(JSON.stringify(r.data),true,'Ancienne version du fichier de sauvegarde');
    }
  }
  const w=await hd.createWritable(); await w.write(json); await w.close();
  setSig(LS_ESIG,sigState(JSON.stringify(state)));
  return true;
}
/* Bouton « Sauvegarder » : fichier lié si présent, sinon fichier choisi une fois, sinon téléchargement. */
async function quickBackup(){
  flush();
  const compact=JSON.stringify(state);
  try{
    if(fileHandle){
      if(awaitingLoad){ await reconnect(); return; }
      if(fileState!=='ok'){
        if(!(await ensureRW(fileHandle))){ toast('Autorisation refusée'); return; }
        fileState='ok';
      }
      const act=await queueFileWrite();
      if(act==='write'||act==='noop') toast('Sauvegardé dans « '+fileHandle.name+' »');
      else if(act==='hold') toast('Rien n’a été écrit : conflit à résoudre (pastille en haut)');
      else if(act==='error') toast('Le fichier lié est inaccessible');
    }else if(window.showSaveFilePicker){
      let hd=exportHandle;
      if(hd){ try{ if(!(await ensureRW(hd))) hd=null; }catch(e){ hd=null; } }
      if(!hd){
        hd=await showSaveFilePicker({suggestedName:FN+'-backup.json',types:JSON_TYPES});
        exportHandle=hd; try{ await idbSet('exportHandle',hd); }catch(e){}
        setSig(LS_ESIG,'');
      }
      if(!(await writeGuarded(hd,JSON.stringify(state,null,2)))) return;
      markBackup(compact); toast('Sauvegardé dans « '+hd.name+' »');
    }else{
      exportJson(); toast('Fichier téléchargé (dossier Téléchargements)');
    }
  }catch(e){ if(e&&e.name==='AbortError') return; console.warn(e); toast('Sauvegarde impossible : '+((e&&e.message)||e)); }
  setStatus(); refreshSettings();
}
function backupDest(){
  return fileHandle?'fichier lié « '+fileHandle.name+' »':exportHandle?'« '+exportHandle.name+' »':(window.showSaveFilePicker?'à choisir au premier clic':'téléchargement (dossier Téléchargements)');

/* Teinte d'une nouvelle carte : la moins utilisée sur la page ; à égalité, la plus éloignée des teintes déjà présentes. */
function nextHue(){
  const used=cards().map(c=>c.hue), count=x=>used.filter(u=>u===x).length;
  const least=Math.min(...HUES.map(count)), cand=HUES.filter(x=>count(x)===least);
  const gap=x=>Math.min(180,...used.map(u=>{ const d=Math.abs(x-u)%360; return Math.min(d,360-d); }));
  return cand.sort((a,b)=>gap(b)-gap(a))[0];
}

/* Une carte (mode lecture ou édition). Le glisser-déposer n'est activé que par la poignée en mode édition. */
function renderCard(card){

  const isCol=!editing&&!q&&card.collapsed;

    const grip=h('button',{class:'ib grip',title:'Déplacer la carte','aria-label':'Déplacer la carte',onmousedown:()=>{ cell.draggable=true; }},icon('grip'));

    const hue=h('button',{class:'hue',title:'Changer la couleur','aria-label':'Changer la couleur',onclick:()=>{

    }});
    head=h('div',{class:'card-h edit'},grip,hue,
      h('input',{class:'in title-in',value:card.title,placeholder:'Titre',dataset:{f:card.id+':title'},oninput:e=>{ card.title=e.target.value; touch(); }}),
      h('button',{class:'ib',title:card.w===2?'Carte étroite':'Carte large','aria-label':'Largeur de la carte',onclick:()=>{ card.w=card.w===2?1:2; touch(true); render(); }},icon('width')),
      state.pages.length>1&&h('button',{class:'ib',title:'Déplacer vers une autre page','aria-label':'Déplacer vers une autre page',onclick:e=>pageMenu(e.currentTarget,card.id)},icon('moveTo')),
      h('button',{class:'ib del',title:'Supprimer la carte','aria-label':'Supprimer la carte',onclick:()=>deleteCard(card.id)},icon('x')));
    cell.addEventListener('dragstart',e=>{
      if(e.target!==cell) return;
      drag={kind:'card',id:card.id};
      e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',card.id);
      cell.classList.add('dragging');
    });
    cell.addEventListener('dragend',()=>{ cell.draggable=false; cell.classList.remove('dragging'); drag=null; clearDrop(); });

      if(!drag||drag.kind!=='card') return;
      e.preventDefault(); e.stopPropagation(); clearDrop();
      if(drag.id===card.id){ drag.target=null; return; }
      const r=cell.getBoundingClientRect(); const after=(e.clientY-r.top)>r.height/2;
      cell.classList.add(after?'drop-after':'drop-before'); drag.target=card.id; drag.after=after;
    });
    cell.addEventListener('drop',e=>{
      if(!drag||drag.kind!=='card') return;
      e.preventDefault(); e.stopPropagation();

      if(d.target) moveCard(d.id,d.target,d.after);
    });
  }else{
    const toggle=()=>{ if(q) return; const real=cardById(card.id); if(!real) return; real.collapsed=!real.collapsed; touch(); renderBody(); };
    const nb=isCol?(card.type==='links'?card.items.length:card.type==='table'?Math.max(0,card.rows.length-1):0):0;
    head=h('div',{class:'card-h'+(q?'':' tog'),role:q?null:'button',tabindex:q?null:'0','aria-expanded':q?null:String(!isCol),title:q?null:(isCol?'Déplier':'Replier'),
        onclick:toggle,onkeydown:e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } }},
      h('span',{class:'dot'}),h('h2',{},card.title),
      nb?h('span',{class:'nb'},String(nb)):null,
      q?null:h('span',{class:'chev'},icon('chev',15)));
  }
  kard.append(head); if(!isCol) kard.append(body); cell.append(kard);
  return cell;
}

function addItem(card){
  const it={id:uid(),name:'',url:''}; card.items.push(it);
  pendingFocus=card.id+':n:'+it.id; touch(true); render();
}
function dropItem(e){
  if(!drag||drag.kind!=='item') return;
  e.preventDefault(); e.stopPropagation();
  const d=drag, t=d.target; clearDrop(); drag=null;
  if(!t) return;
  const from=cardById(d.cardId), to=cardById(t.card); if(!from||!to) return;
  const i=from.items.findIndex(x=>x.id===d.id); if(i<0) return;
  const [it]=from.items.splice(i,1);
  let idx=t.before?to.items.findIndex(x=>x.id===t.before):to.items.length;
  if(idx<0) idx=to.items.length; else if(t.after) idx++;
  to.items.splice(idx,0,it); touch(true); render();
}

/* --- Tableaux --- */
function tableView(card){
  const rows=card.rows, hasHead=rows[0].some(c=>c.trim());
  const tbl=h('table',{class:'tbl'});
  if(hasHead) tbl.append(h('thead',{},h('tr',{},rows[0].map(c=>{ const th=h('th'); rich(c,th); return th; }))));
  const tb=h('tbody');
  rows.slice(hasHead?1:0).forEach(r=>tb.append(h('tr',{},r.map(c=>{ const td=h('td'); rich(c,td); return td; }))));
  tbl.append(tb);
  return h('div',{class:'tscroll'},tbl);
}
/* Déplace une ligne de tableau (la ligne 0, l'en-tête, ne bouge pas). to = position d'insertion avant retrait. */
function moveRow(card,from,to){
  const rows=card.rows; if(to==null||from<1) return;
  let idx=to; if(from<idx) idx--;
  idx=Math.max(1,Math.min(idx,rows.length-1));
  if(idx===from) return;
  const [r]=rows.splice(from,1); rows.splice(idx,0,r);
  touch(true); render();
}
/* Colonnes d'un tableau (toutes les lignes ont le même nombre de cellules) :
   insère une colonne vide à la position `at`, ou déplace la colonne `from` vers `to` (sans effet hors limites). */
function insertColumn(card,at){
  card.rows.forEach(r=>r.splice(at,0,''));
  pendingFocus=card.id+':t:0:'+at; touch(true); render();
}
function moveColumn(card,from,to){
  if(to<0||to>=card.rows[0].length||to===from) return;
  card.rows.forEach(r=>{ const [v]=r.splice(from,1); r.splice(to,0,v); });
  touch(true); render();
}
function tableEdit(card){
  const rows=card.rows, nc=rows[0].length;
  const tbl=h('table',{class:'tbl edit'});
  const head=h('tr');
  /* Une barre d'actions au-dessus de chaque colonne : déplacer à gauche/droite, insérer (avant/après), supprimer. */
  for(let c=0;c<nc;c++){
    const btn=(cls,title,ic,fn,off)=>h('button',{class:'ib '+cls,title,'aria-label':title,disabled:off,onclick:fn},icon(ic,13));
    head.append(h('th',{},h('div',{class:'colbar'},
      btn('','Déplacer la colonne à gauche','left',()=>moveColumn(card,c,c-1),c===0),
      btn('','Déplacer la colonne à droite','right',()=>moveColumn(card,c,c+1),c===nc-1),
      btn('','Insérer une colonne…','plus',e=>popMenu(e.currentTarget,'Insérer une colonne',[{label:'Avant cette colonne',fn:()=>insertColumn(card,c)},{label:'Après cette colonne',fn:()=>insertColumn(card,c+1)}])),
      nc>1?btn('del','Supprimer la colonne','x',()=>{ rows.forEach(r=>r.splice(c,1)); touch(true); render(); }):null)));
  }
  head.prepend(h('th'));
  head.append(h('th'));
  tbl.append(h('thead',{},head));
  const tb=h('tbody');
  rows.forEach((r,ri)=>{
    const tr=h('tr',{class:ri===0?'hdr':''});
    if(ri===0) tr.append(h('td'));
    else{
      const grip=h('button',{class:'ib grip',title:'Déplacer la ligne','aria-label':'Déplacer la ligne',onmousedown:()=>{ tr.draggable=true; }},icon('grip',14));
      grip.addEventListener('mouseup',()=>{ tr.draggable=false; });
      tr.append(h('td',{},grip));
      tr.addEventListener('dragstart',e=>{
        if(e.target!==tr) return; e.stopPropagation();
        drag={kind:'row',cardId:card.id,from:ri}; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','ligne'); tr.style.opacity='.4';
      });

      tr.addEventListener('dragover',e=>{
        if(!drag||drag.kind!=='row'||drag.cardId!==card.id) return;
        e.preventDefault(); e.stopPropagation(); clearDrop();
        if(drag.from===ri){ drag.to=null; return; }
        const r0=tr.getBoundingClientRect(), after=(e.clientY-r0.top)>r0.height/2;
        tr.classList.add(after?'drop-after':'drop-before'); drag.to=ri+(after?1:0);
      });
      tr.addEventListener('drop',e=>{
        if(!drag||drag.kind!=='row'||drag.cardId!==card.id) return;
        e.preventDefault(); e.stopPropagation(); const d=drag; clearDrop(); drag=null; moveRow(card,d.from,d.to);
      });
    }
    r.forEach((v,ci)=>tr.append(h('td',{},h('input',{class:'in',value:v,placeholder:ri===0?'En-tête':'',dataset:{f:card.id+':t:'+ri+':'+ci},
      oninput:e=>{ rows[ri][ci]=e.target.value; touch(); },
      onkeydown:e=>{
        if(e.key!=='Enter') return; e.preventDefault();
        if(ri===rows.length-1){ rows.push(new Array(nc).fill('')); pendingFocus=card.id+':t:'+(ri+1)+':'+ci; touch(true); render(); }
        else { const el=document.querySelector('[data-f="'+card.id+':t:'+(ri+1)+':'+ci+'"]'); if(el) el.focus(); }
      }}))));
    tr.append(h('td',{},rows.length>1?h('button',{class:'ib del',title:'Supprimer la ligne','aria-label':'Supprimer la ligne',onclick:()=>{ rows.splice(ri,1); touch(true); render(); }},icon('x',13)):null));
    tb.append(tr);

  return h('div',{},h('div',{class:'tedit'},tbl),
    h('div',{class:'tactions'},
      h('button',{class:'btn sm',onclick:()=>{ rows.push(new Array(nc).fill('')); pendingFocus=card.id+':t:'+(rows.length-1)+':0'; touch(true); render(); }},icon('plus',14),'Ligne'),
      h('button',{class:'btn sm',onclick:()=>{ rows.forEach(r=>r.push('')); touch(true); render(); }},icon('plus',14),'Colonne')));
}

/* Lecture du format « Netscape Bookmark » sans créer d'éléments depuis le fichier */
function parseBookmarks(text){

  const stack=[root]; let pending=null;
  const re=/<\/dl\s*>|<dl\b[^>]*>|<h3\b([^>]*)>([\s\S]*?)<\/h3\s*>|<a\b([^>]*)>([\s\S]*?)<\/a\s*>/gi;
  let m;
  while((m=re.exec(text))){
    const t=m[0].slice(0,4).toLowerCase(), cur=stack[stack.length-1];
    if(t==='</dl'){ if(stack.length>1) stack.pop(); pending=null; }
    else if(t.slice(0,3)==='<dl'){ stack.push(pending||cur); pending=null; }
    else if(t.slice(0,3)==='<h3'){ const node={name:plain(m[2])||'(sans nom)',attrs:(m[1]||'').toUpperCase(),links:[],kids:[]}; cur.kids.push(node); pending=node; }
    else{
      pending=null;
      const hm=/\bhref\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i.exec(m[3]||'');
      const url=hm?decodeEnt(hm[1]!=null?hm[1]:hm[2]!=null?hm[2]:hm[3]).trim():'';
      if(url) cur.links.push({title:plain(m[4]),url});
    }
  }
  return root;
}
const countLinks=n=>n.links.length+n.kids.reduce((a,k)=>a+countLinks(k),0);
/* Les dossiers de 1er niveau sont-ils des conteneurs du navigateur (barre de favoris…) ? */
function detectSkipTop(tree){
  const k=tree.kids; if(!k.length) return false;
  if(k.some(x=>/PERSONAL_TOOLBAR_FOLDER|UNFILED_BOOKMARKS_FOLDER/.test(x.attrs))) return true;
  return k.length===1&&!tree.links.length;
}
/* Clé de comparaison pour repérer les doublons (sans www, sans « / » final) ; '' si l'adresse n'est pas utilisable. */
function linkKey(u){
  const f=fixUrl(u); if(!f) return '';
  try{
    const x=new URL(f);
    if(/^https?:$/.test(x.protocol)) return x.hostname.replace(/^www\./,'').toLowerCase()+(x.port?':'+x.port:'')+x.pathname.replace(/\/+$/,'')+x.search+x.hash;
  }catch(e){}
  return f.toLowerCase();
}
function existingKeys(){
  const set=new Set();
  state.pages.forEach(p=>p.cards.forEach(c=>{ if(c.type==='links') c.items.forEach(i=>{ const k=linkKey(i.url); if(k) set.add(k); }); }));
  return set;
}
/* Un onglet par dossier de 1er niveau utile ; une carte par dossier contenant des liens ; titre = chemin depuis l'onglet */
function buildPlan(tree,skipTop){
  const groups=[], idx=new Map(); let cid=0;
  const grp=name=>{ const k=name.trim().toLowerCase(); let g=idx.get(k); if(!g){ g={id:'g'+idx.size,name:name.trim(),checked:true,open:false,cards:[]}; idx.set(k,g); groups.push(g); } return g; };
  const add=(page,title,links,path)=>{ if(!links.length) return; grp(page).cards.push({id:'c'+(cid++),title,path:path||title,checked:true,open:false,links:links.map(l=>({title:l.title,url:l.url}))}); };
  const walk=(node,segs,page)=>{ add(page,segs.length?segs.slice(-2).join(' › '):page,node.links,segs.join(' › ')); node.kids.forEach(k=>walk(k,segs.concat(k.name),page)); };
  const direct=[];
  tree.kids.forEach(top=>{
    if(skipTop){ top.kids.forEach(sub=>walk(sub,[],sub.name)); if(top.links.length) direct.push(top); }
    else walk(top,[],top.name);
  });
  direct.forEach(top=>add(top.name,top.name,top.links));
  add('Autres','Autres',tree.links);
  return groups;
}
function planStats(pv){
  const st={total:0,bad:0,inFile:0,exist:0,cards:0,schemes:new Set()}, seen=new Set();
  pv.plan.forEach(g=>g.cards.forEach(c=>{ st.cards++; c.links.forEach(l=>{
    st.total++; l.key=linkKey(l.url);
    if(!l.key){ l.bad=true; st.bad++; const m=/^([a-z][a-z0-9+.-]*):/i.exec(l.url); st.schemes.add(m?m[1].toLowerCase()+':':'?'); return; }
    if(pv.existing.has(l.key)) st.exist++;
    if(seen.has(l.key)) st.inFile++; else seen.add(l.key);
  }); }));
  return st;
}
/* Applique les cases cochées et options : marque chaque lien (l.skip) et compte ceux qui seront importés. */
function recompute(pv){
  const seen=new Set(); pv.kept=0;
  pv.plan.forEach(g=>{ g.kept=0; g.cards.forEach(c=>{ c.kept=[];
    c.links.forEach(l=>{
      l.skip=null;
      if(!g.checked||!c.checked){ l.skip='off'; return; }
      if(l.bad){ l.skip='bad'; return; }
      if(pv.skipExisting&&pv.existing.has(l.key)){ l.skip='existing'; return; }
      if(pv.skipInFile){ if(seen.has(l.key)){ l.skip='infile'; return; } seen.add(l.key); }
      c.kept.push(l);
    });
    g.kept+=c.kept.length; }); pv.kept+=g.kept; });
}
let PV=null;
const idlg=$('#idlg');
function openImportPreview(text,fileName){
  const tree=parseBookmarks(text);
  if(!countLinks(tree)){ toast('Aucun favori trouvé dans ce fichier (un export de favoris au format HTML est attendu)'); return; }
  PV={fileName,tree,skipTop:detectSkipTop(tree),skipExisting:true,skipInFile:false,existing:existingKeys(),plan:[],stats:null,kept:0};
  rebuildPlan();
  idlg.addEventListener('close',()=>{ PV=null; },{once:true});
  idlg.showModal(); renderPreview();
}
function rebuildPlan(){ PV.plan=buildPlan(PV.tree,PV.skipTop); PV.stats=planStats(PV); recompute(PV); }
const pageExists=name=>state.pages.some(p=>p.name.trim().toLowerCase()===name.trim().toLowerCase());
const plural=(n,w)=>n+' '+w+(n>1?'s':'');
function renderPreview(){
  const pv=PV; if(!pv) return;
  const oldBody=idlg.querySelector('.ibody'), sc=oldBody?oldBody.scrollTop:0, st=pv.stats;
  const nGroups=pv.plan.filter(g=>g.kept>0).length, nCards=pv.plan.reduce((a,g)=>a+g.cards.filter(c=>c.kept.length).length,0);
  const opt=(label,checked,on)=>h('label',{class:'chk'},h('input',{type:'checkbox',checked,onchange:e=>on(e.target.checked)}),h('span',{},label));
  const setAll=v=>{ pv.plan.forEach(g=>{ g.checked=v; g.cards.forEach(c=>{ c.checked=v; }); }); recompute(pv); renderPreview(); };
  const sum=h('div',{class:'sum'},'À importer : '+plural(pv.kept,'lien')+' · '+plural(nCards,'carte')+' · '+plural(nGroups,'page'));
  const importBtn=h('button',{class:'btn primary',disabled:pv.kept===0,onclick:()=>applyImport(pv)},pv.kept?'Importer '+plural(pv.kept,'lien'):'Rien à importer');
  const groupEl=g=>{
    const flag=h('span',{class:'bm-flag'},pageExists(g.name)?'page existante':'nouvelle page');
    const head=h('div',{class:'bm-gh'},
      h('input',{type:'checkbox',checked:g.checked,'aria-label':'Importer cette page',onchange:e=>{ g.checked=e.target.checked; recompute(pv); renderPreview(); }}),
      h('button',{class:'ib',title:g.open?'Replier':'Déplier','aria-label':'Déplier',onclick:()=>{ g.open=!g.open; renderPreview(); }},h('span',{class:'bm-chev'+(g.open?' open':'')},icon('chev',15))),
      h('input',{class:'in nm',value:g.name,placeholder:'Nom de la page',list:'bmPages','aria-label':'Nom de la page',oninput:e=>{ g.name=e.target.value; flag.textContent=pageExists(g.name)?'page existante':'nouvelle page'; }}),
      flag,
      h('span',{class:'bm-n'+(g.checked&&g.kept<g.cards.reduce((a,c)=>a+c.links.length,0)?' part':'')},g.checked?plural(g.kept,'lien')+' · '+plural(g.cards.filter(c=>c.kept.length).length,'carte'):'ignorée'));
    const box=h('div',{class:'bm-g'},head);
    if(g.open){
      const list=h('div',{class:'bm-cards'});
      g.cards.forEach(c=>{
        const total=c.links.length, live=g.checked&&c.checked;
        const row=h('div',{class:'bm-card'+(live?'':' off')},
          h('input',{type:'checkbox',checked:c.checked,disabled:!g.checked,'aria-label':'Importer cette carte',onchange:e=>{ c.checked=e.target.checked; recompute(pv); renderPreview(); }}),
          h('input',{class:'in',value:c.title,title:c.path&&c.path!==c.title?'Chemin complet : '+c.path:null,placeholder:'Titre de la carte','aria-label':'Titre de la carte',oninput:e=>{ c.title=e.target.value; }}),
          h('span',{class:'bm-n'+(live&&c.kept.length<total?' part':'')},live&&c.kept.length<total?c.kept.length+' / '+plural(total,'lien'):plural(total,'lien')),
          h('button',{class:'ib',title:'Voir les liens','aria-label':'Voir les liens',onclick:()=>{ c.open=!c.open; renderPreview(); }},h('span',{class:'bm-chev'+(c.open?' open':'')},icon('chev',14))));
        if(c.open){
          const why={bad:' (adresse non prise en charge)',existing:' (déjà présent)',infile:' (doublon)'};
          row.append(h('ul',{class:'bm-links'},c.links.map(l=>h('li',{class:l.skip&&l.skip!=='off'?'skip':'',title:l.url},(l.title||hostOf(l.url)||l.url)+(why[l.skip]||'')))));
        }
        list.append(row);
      });
      box.append(list);
    }
    return box;
  };
  const body=h('div',{class:'ibody'},
    h('div',{class:'ds',style:'padding:6px 0 4px'},
      h('p',{},'« '+pv.fileName+' » : '+plural(st.total,'lien')+' dans '+plural(st.cards,'dossier')+'. Cochez ce qui doit être importé ; chaque page et chaque carte peut être renommée. Donner à une page le nom d’une page existante y ajoute les cartes.'),
      opt('Les dossiers de 1er niveau sont des conteneurs du navigateur (barre de favoris…) : leurs sous-dossiers deviennent des pages',pv.skipTop,v=>{ pv.skipTop=v; rebuildPlan(); renderPreview(); }),
      opt('Ignorer les liens déjà présents dans ma page ('+st.exist+')',pv.skipExisting,v=>{ pv.skipExisting=v; recompute(pv); renderPreview(); }),
      opt('Ignorer les doublons à l’intérieur du fichier ('+st.inFile+')',pv.skipInFile,v=>{ pv.skipInFile=v; recompute(pv); renderPreview(); }),
      st.bad?h('p',{},st.bad+' lien'+(st.bad>1?'s':'')+' ignoré'+(st.bad>1?'s':'')+' (adresse non prise en charge : '+[...st.schemes].join(', ')+').'):null),
    pv.plan.map(groupEl),
    h('datalist',{id:'bmPages'},state.pages.map(p=>h('option',{value:p.name}))));
  idlg.replaceChildren(
    h('div',{class:'dh'},h('h3',{},'Importer des favoris'),h('button',{class:'ib',onclick:()=>idlg.close(),'aria-label':'Fermer'},icon('x'))),
    body,
    h('div',{class:'ifoot'},
      h('button',{class:'btn sm',onclick:()=>setAll(true)},'Tout cocher'),
      h('button',{class:'btn sm',onclick:()=>setAll(false)},'Tout décocher'),
      sum,h('button',{class:'btn',onclick:()=>idlg.close()},'Annuler'),importBtn));
  const nb=idlg.querySelector('.ibody'); if(nb) nb.scrollTop=sc;
}
/* Crée les pages/cartes à partir de l'aperçu validé : une seule étape d'annulation, ancienne version dans l'historique. */
function applyImport(pv){
  recompute(pv);
  const groups=pv.plan.filter(g=>g.kept>0); if(!groups.length) return;
  flush(); addSnap(JSON.stringify(state),true,'Avant import de favoris');
  let nLinks=0,nCards=0,firstId=null;
  groups.forEach((g,gi)=>{
    const name=g.name.trim()||'Favoris importés';
    let pg=state.pages.find(p=>p.name.trim().toLowerCase()===name.toLowerCase());
    if(!pg){ pg={id:uid(),name,cards:[]}; state.pages.push(pg); }
    if(!firstId) firstId=pg.id;
    const hue=HUES[gi%HUES.length];
    g.cards.forEach(c=>{
      if(!c.kept.length) return;
      pg.cards.push({id:uid(),type:'links',title:c.title.trim()||name,hue,w:1,collapsed:false,
        items:c.kept.map(l=>({id:uid(),name:l.title||hostOf(l.url),url:l.url}))});
      nCards++; nLinks+=c.kept.length;
    });
  });
  idlg.close();
  activeId=firstId; saveTab(); touch(true); render();
  toast(plural(nLinks,'lien')+' importé'+(nLinks>1?'s':'')+' ('+plural(nCards,'carte')+', '+plural(groups.length,'page')+')',{label:'Annuler',fn:undo});
}
function exportBookmarksHtml(){
  flush();
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const now=Math.floor(Date.now()/1000), node=name=>({name,links:[],kids:new Map()});
  const tops=[]; let total=0;
  state.pages.forEach(pg=>{
    const top=node(pg.name||'Page'); let any=false;
    pg.cards.forEach(c=>{
      if(c.type!=='links') return;
      const items=c.items.map(i=>({name:i.name||hostOf(i.url),href:fixUrl(i.url)})).filter(i=>i.href);
      if(!items.length) return;
      let segs=str(c.title).split('›').map(x=>x.trim()).filter(Boolean);
      if(segs.length===1&&segs[0].toLowerCase()===(pg.name||'').trim().toLowerCase()) segs=[];
      let cur=top;
      segs.forEach(sg=>{ const k=sg.toLowerCase(); if(!cur.kids.has(k)) cur.kids.set(k,node(sg)); cur=cur.kids.get(k); });
      cur.links.push(...items); total+=items.length; any=true;
    });
    if(any) tops.push(top);
  });
  if(!total){ toast('Aucun lien à exporter'); return; }
  const ind=n=>'    '.repeat(n);
  const ser=(n,lvl)=>{
    let o='';
    n.links.forEach(l=>{ o+=ind(lvl)+'<DT><A HREF="'+esc(l.href)+'" ADD_DATE="'+now+'">'+esc(l.name)+'</A>\n'; });
    n.kids.forEach(k=>{ o+=ind(lvl)+'<DT><H3 ADD_DATE="'+now+'">'+esc(k.name)+'</H3>\n'+ind(lvl)+'<DL><p>\n'+ser(k,lvl+1)+ind(lvl)+'</DL><p>\n'; });
    return o;
  };
  let out='<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<!-- This is an automatically generated file.\n     It will be read and overwritten.\n     DO NOT EDIT! -->\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n'
    +ind(1)+'<DT><H3 ADD_DATE="'+now+'">'+esc(state.title||PID)+'</H3>\n'+ind(1)+'<DL><p>\n';
  tops.forEach(t=>{ out+=ind(2)+'<DT><H3 ADD_DATE="'+now+'">'+esc(t.name)+'</H3>\n'+ind(2)+'<DL><p>\n'+ser(t,3)+ind(2)+'</DL><p>\n'; });
  out+=ind(1)+'</DL><p>\n</DL><p>\n';
  downloadBlob(new Blob([out],{type:'text/html'}),FN+'-bookmark-'+new Date().toISOString().slice(0,10)+'.html');
  toast(plural(total,'lien')+' exporté'+(total>1?'s':'')+' (dossier Téléchargements)');
}
$('#bmimport').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  if(f.size>MAX_BM){ toast('Fichier trop volumineux pour un export de favoris'); return; }
  try{ openImportPreview(await f.text(),f.name); }catch(err){ console.warn(err); toast('Fichier illisible'); }
});

/* ---------- Raccourcis & cycle de vie ---------- */
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement&&document.activeElement.tagName)||'');
  if(e.key==='Escape') closeMenu();
  if(!editing&&!dlg.open&&((e.key==='/'&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey)||((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='k'))){
    const sb=$('#q'); if(sb){ e.preventDefault(); sb.focus(); sb.select(); } return;
  }
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'&&editing&&!typing){ e.preventDefault(); undo(); }
});
window.addEventListener('beforeunload',()=>{ if(saveTimer) flush(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&saveTimer) flush(); });

/* ---------- Démarrage ---------- */
if(!freshStart) addSnap(committed,false);
render();
initFile();
setTimeout(()=>{ if(backupDue()){ const bk=readBk(); toast('Sauvegarde conseillée — '+(bk.t?'dernière '+ago(bk.t):'aucune pour l’instant'),{label:'Sauvegarder',fn:quickBackup}); } },1800);
})();
